# ==============================================================================
# SYSMAX TECNOLOGIA - CONFIGURAÇÃO NGINX PARA AAPANEL COM PHP 8.5
# ==============================================================================
# Instruções para o aaPanel:
# 1. No aaPanel, vá em "Website" -> Clique no seu site -> Aba "URL Rewrite" ou "Config".
# 2. Copie e cole os blocos abaixo no arquivo de configuração do seu site no Nginx.
# 3. Altere o caminho /www/wwwroot/sysmax.com.br para o diretório real do seu site.
# ==============================================================================

server {
    listen 80;
    listen 443 ssl http2;
    server_name sysmax.com.br www.sysmax.com.br;
    
    # Raiz do projeto após deploy via Git
    root /www/wwwroot/sysmax.com.br;
    index index.php index.html index.htm;

    # SSL (Gerenciado automaticamente pelo Let's Encrypt no aaPanel)
    # ssl_certificate    /www/server/panel/vhost/cert/sysmax.com.br/fullchain.pem;
    # ssl_certificate_key /www/server/panel/vhost/cert/sysmax.com.br/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    # ssl_prefer_server_ciphers on;
    # ssl_session_timeout 10m;
    # ssl_session_cache builtin:1000 shared:SSL:10m;

    # Cabeçalhos de Segurança
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compressão Gzip de Alta Eficiência
    gzip on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_http_version 1.1;
    gzip_comp_level 6;
    gzip_types text/plain application/javascript application/x-javascript text/javascript text/css application/xml application/json image/svg+xml font/woff font/woff2;
    gzip_vary on;
    gzip_proxied   expired no-cache no-store private auth;
    gzip_disable   "MSIE [1-6]\.";

    # Cache de Assets Estáticos Compilados (dist/assets ou assets/)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 365d;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
        try_files $uri $uri/ /dist$uri =404;
    }

    # Rota específica para download do JSON do Elementor
    location ~* ^/(api/elementor-template\.json|elementor\.json|sysmax-elementor-template\.json)$ {
        try_files /wordpress-elementor/sysmax-elementor-template.json /dist/sysmax-elementor-template.json /index.php?$query_string;
        add_header Content-Type "application/json; charset=utf-8";
        add_header Access-Control-Allow-Origin "*";
    }

    # Roteamento Principal da Aplicação SPA / PHP
    location / {
        # Prioriza arquivos estáticos do dist, arquivos na raiz, ou passa para o index.php (PHP 8.5)
        try_files $uri $uri/ /dist/$uri /dist/index.html /index.php?$query_string;
    }

    # Processamento PHP 8.5 (Socket padrão do aaPanel com PHP 8.5)
    location ~ [^/]\.php(/|$) {
        try_files $uri =404;
        fastcgi_pass unix:/tmp/php-cgi-85.sock;
        fastcgi_index index.php;
        include fastcgi.conf;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 180;
    }

    # Bloqueio de Segurança para arquivos confidenciais e repositório Git
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.svn|\.project|LICENSE|README\.md|\.env.*|package\.json|package-lock\.json|tsconfig\.json|vite\.config\.ts|server\.ts|leads\.log) {
        return 404;
    }

    # Logs
    access_log  /www/wwwlogs/sysmax.com.br.log;
    error_log  /www/wwwlogs/sysmax.com.br.error.log;
}
