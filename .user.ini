; ==============================================================================
; SYSMAX TECNOLOGIA - DIRETIVAS DO PHP 8.5 PARA AAPANEL
; ==============================================================================
; Este arquivo aplica configurações otimizadas para o runtime PHP 8.5 no aaPanel
; ==============================================================================

memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 120
max_input_time = 120
date.timezone = America/Sao_Paulo
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
session.cookie_httponly = 1
session.use_strict_mode = 1
session.cookie_samesite = "Lax"
expose_php = Off
